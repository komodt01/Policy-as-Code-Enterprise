name: Policy Validation Pipeline
on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'policies/**'
      - 'terraform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'policies/**'
      - 'terraform/**'

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    name: Validate Policy Syntax and Compliance
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js for JSON Validation
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install JSON Validation Tools
      run: |
        npm install -g ajv-cli
        
    - name: Validate AWS SCP Policies
      run: |
        echo "🔍 Validating AWS Service Control Policies..."
        for policy in policies/aws/scp/*.json; do
          echo "Validating $(basename $policy)"
          if jq empty "$policy" >/dev/null 2>&1; then
            echo "✅ $(basename $policy) - Valid JSON"
          else
            echo "❌ $(basename $policy) - Invalid JSON"
            exit 1
          fi
        done
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        
    - name: Terraform Format Check
      working-directory: terraform/aws
      run: |
        terraform fmt -check
        
    - name: Terraform Init
      working-directory: terraform/aws
      run: |
        terraform init -backend=false
        
    - name: Terraform Validate
      working-directory: terraform/aws
      run: |
        terraform validate
        
    - name: Generate Policy Report
      run: |
        echo "# 📊 Policy Validation Report" > policy-report.md
        echo "**Validation Date:** $(date)" >> policy-report.md
        echo "**Commit:** ${{ github.sha }}" >> policy-report.md
        echo "**Branch:** ${{ github.ref_name }}" >> policy-report.md
        echo "" >> policy-report.md
        echo "## ✅ Validation Results" >> policy-report.md
        echo "- AWS SCP Policies: $(ls policies/aws/scp/*.json | wc -l) validated" >> policy-report.md
        echo "- Terraform Configuration: Validated successfully" >> policy-report.md
        echo "- JSON Syntax: All policies passed" >> policy-report.md
        echo "" >> policy-report.md
        echo "## 🛡️ Security Controls Validated" >> policy-report.md
        echo "- Resource tagging enforcement" >> policy-report.md
        echo "- Encryption requirements" >> policy-report.md
        echo "- Secure transport mandates" >> policy-report.md
        
    - name: Upload Policy Report
      uses: actions/upload-artifact@v4
      with:
        name: policy-validation-report
        path: policy-report.md
        
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('policy-report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });

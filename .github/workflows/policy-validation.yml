name: Policy Validation Pipeline

on:
push:
branches: [master]
paths:
- 'policies/**'
- 'terraform/**'
pull_request:
branches: [master]
paths:
- 'policies/**'
- 'terraform/**'

jobs:
validate-policies:
runs-on: ubuntu-latest
name: Validate Policy and Terraform Configuration

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Validate AWS SCP JSON Syntax
    run: |
      echo "Validating AWS Service Control Policy JSON..."

      for policy in policies/aws/scp/*.json; do
        echo "Validating $(basename "$policy")"

        if jq empty "$policy" >/dev/null 2>&1; then
          echo "$(basename "$policy") - Valid JSON"
        else
          echo "$(basename "$policy") - Invalid JSON"
          exit 1
        fi
      done

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: 1.6.0

  - name: Terraform Format Check
    working-directory: terraform/aws
    run: terraform fmt -check

  - name: Terraform Init
    working-directory: terraform/aws
    run: terraform init -backend=false

  - name: Terraform Validate
    working-directory: terraform/aws
    run: terraform validate

  - name: Generate Validation Report
    run: |
      echo "# Policy Validation Report" > policy-report.md
      echo "" >> policy-report.md
      echo "**Validation Date:** $(date)" >> policy-report.md
      echo "**Commit:** ${{ github.sha }}" >> policy-report.md
      echo "**Branch:** ${{ github.ref_name }}" >> policy-report.md
      echo "" >> policy-report.md
      echo "## Validation Performed" >> policy-report.md
      echo "" >> policy-report.md
      echo "- AWS SCP JSON syntax validation completed" >> policy-report.md
      echo "- Terraform formatting checked" >> policy-report.md
      echo "- Terraform initialization completed without backend configuration" >> policy-report.md
      echo "- Terraform configuration validated" >> policy-report.md
      echo "" >> policy-report.md
      echo "## Scope" >> policy-report.md
      echo "" >> policy-report.md
      echo "This workflow validates policy JSON syntax and Terraform configuration." >> policy-report.md
      echo "It does not establish that a policy is compliant with a regulatory framework or safe for organization-wide enforcement." >> policy-report.md
      echo "Policy behavior, operational impact, exception requirements, and enforcement scope require additional architecture and testing review." >> policy-report.md

  - name: Upload Validation Report
    uses: actions/upload-artifact@v4
    with:
      name: policy-validation-report
      path: policy-report.md

  - name: Comment on Pull Request with Validation Results
    if: github.event_name == 'pull_request'
    uses: actions/github-script@v7
    with:
      script: |
        const fs = require('fs');
        const report = fs.readFileSync('policy-report.md', 'utf8');

        github.rest.issues.createComment({
          issue_number: context.issue.number,
          owner: context.repo.owner,
          repo: context.repo.repo,
          body: report
        });
```

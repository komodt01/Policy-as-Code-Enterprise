name: Documentation Quality Check

on:
push:
branches: [master]
paths:
- '**/*.md'
- 'docs/**'
pull_request:
branches: [master]
paths:
- '**/*.md'
- 'docs/**'

jobs:
documentation-check:
runs-on: ubuntu-latest
name: Validate Documentation

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install Documentation Tools
    run: |
      npm install -g markdownlint-cli
      npm install -g markdown-link-check

  - name: Lint Markdown Files
    run: |
      echo "Checking Markdown formatting..."

      markdownlint '**/*.md' \
        --ignore node_modules \
        --ignore .github || true

  - name: Check Documentation Links
    run: |
      echo "Checking documentation links..."

      find . \
        -name "*.md" \
        -not -path "./node_modules/*" \
        -not -path "./.github/*" \
        -print0 |
      xargs -0 -r -n 1 markdown-link-check || true

  - name: Validate Core Documentation
    run: |
      python3 << 'PYTHON'
      import os

      required_items = [
          "README.md",
          "business-case",
          "CONTRIBUTING.md",
          "LICENSE"
      ]

      results = []

      for item in required_items:
          if os.path.exists(item):
              results.append((item, "Present"))
          else:
              results.append((item, "Missing"))

      with open(
          "documentation-quality-report.md",
          "w",
          encoding="utf-8"
      ) as report:

          report.write("# Documentation Quality Report\n\n")

          report.write("## Core Documentation\n\n")

          for item, status in results:
              report.write(f"- {item}: {status}\n")

          report.write("\n## Automated Checks\n\n")
          report.write(
              "- Markdown formatting review executed\n"
          )
          report.write(
              "- Documentation link review executed\n"
          )
          report.write(
              "- Core documentation presence checked\n"
          )

          report.write("\n## Scope Limitation\n\n")
          report.write(
              "These automated checks evaluate documentation structure, "
              "formatting, links, and file presence. They do not determine "
              "whether architecture decisions are correct, whether security "
              "controls are effective, or whether regulatory compliance "
              "has been achieved.\n"
          )

      missing = [
          item
          for item, status in results
          if status == "Missing"
      ]

      if missing:
          print(
              "Missing core documentation: "
              + ", ".join(missing)
          )
          raise SystemExit(1)

      print("Core documentation validation completed.")
      PYTHON

  - name: Upload Documentation Report
    uses: actions/upload-artifact@v4
    with:
      name: documentation-quality-report
      path: documentation-quality-report.md
```
